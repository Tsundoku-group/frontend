name: Frontend Code Check

on:
  pull_request:
    branches:
      - pre-prod
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
    types: [opened, synchronize, reopened]

jobs:
  lint-and-types:
    if: github.base_ref == 'pre-prod' && github.head_ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit